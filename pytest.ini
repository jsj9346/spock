[pytest]
# pytest configuration for Quant Platform

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# PostgreSQL configuration for pytest-postgresql
postgresql_exec = /opt/homebrew/bin/pg_ctl
postgresql_host = localhost
postgresql_port =
postgresql_user = postgres

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=cli
    --cov=modules
    --cov-report=term-missing
    --cov-report=html
    --cov-report=json
    --cov-branch
    --cov-fail-under=70

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    e2e: End-to-end tests for complete workflows
    slow: Tests that take significant time to run
    database: Tests that require database connection
    api: Tests that require external API calls
    asyncio: Async tests using asyncio
    cli: CLI command integration tests
    backtesting: Backtesting engine integration tests

# Asyncio configuration (requires pytest-asyncio)
# asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = cli,modules
branch = True
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */anaconda3/*
    spock_init_db.py
    cli/shell.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov

[coverage:json]
output = coverage.json
