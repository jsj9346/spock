# PostgreSQL Configuration Tuning - Phase 2 OPT-4 (macOS Compatible)
# Generated for Quant Investment Platform
# System: 24.0GB RAM, 10 CPU cores
# Date: 2025-11-23

# ============================================================================
# MEMORY SETTINGS
# ============================================================================

shared_buffers = 6GB
effective_cache_size = 12GB
maintenance_work_mem = 1536MB
work_mem = 204MB
wal_buffers = 16MB

# ============================================================================
# CONNECTION SETTINGS
# ============================================================================

max_connections = 60

# ============================================================================
# CHECKPOINT SETTINGS
# ============================================================================

checkpoint_completion_target = 0.9
wal_compression = on

# ============================================================================
# QUERY PLANNER (macOS Compatible)
# ============================================================================

random_page_cost = 1.1
# effective_io_concurrency = 0  # Disabled for macOS (no posix_fadvise support)
default_statistics_target = 100

# ============================================================================
# PARALLEL QUERY
# ============================================================================

max_worker_processes = 20
max_parallel_workers_per_gather = 4
max_parallel_workers = 10

# ============================================================================
# WRITE PERFORMANCE (Analytics Workload)
# ============================================================================

synchronous_commit = off

# ============================================================================
# NOTES
# ============================================================================
# - effective_io_concurrency disabled for macOS compatibility
# - All other optimizations maintained
