# FX Tracking Configuration
# ============================================================================
# 환율 추적 및 알림 시스템 설정
# ============================================================================

# 신호 임계값 설정
signal_thresholds:
  # Rapid move thresholds (일일 변동률)
  rapid_move:
    critical: 0.05    # 5% 이상: 즉시 알림 (CRITICAL)
    warning: 0.02     # 2-5%: 일일 요약 (WARNING)
    info: 0.01        # 1% 이상: 주간 요약 (INFO)

  # Volatility thresholds (20일 변동성)
  volatility:
    critical: 0.03    # 3% 이상: 즉시 알림 (CRITICAL)
    warning: 0.02     # 2-3%: 일일 요약 (WARNING)
    info: 0.015       # 1.5% 이상: 주간 요약 (INFO)

# 알림 정책 설정
notification_policy:
  # 즉시 알림 (CRITICAL)
  immediate:
    enabled: true
    channels: ['slack', 'email']
    signal_types:
      - 'rapid_appreciation'
      - 'rapid_depreciation'
    min_severity: 'CRITICAL'

  # 일일 요약 (WARNING)
  daily_summary:
    enabled: true
    channels: ['email']
    schedule: '09:00'        # KST 09:00 (장 시작 전)
    min_severity: 'WARNING'
    max_signals: 20          # 최대 20개 신호까지 요약

  # 주간 요약 (INFO)
  weekly_summary:
    enabled: true
    channels: ['email']
    schedule: 'monday 09:00' # 월요일 09:00 KST
    min_severity: 'INFO'
    max_signals: 50

# 알림 채널 설정
channels:
  slack:
    enabled: true
    webhook_url_env: 'SLACK_WEBHOOK_URL'
    default_channel: '#fx-alerts'
    username: 'FX Alert Bot'
    icon_emoji: ':chart_with_upwards_trend:'

  email:
    enabled: true
    sns_topic_arn_env: 'SNS_FX_ALERTS_ARN'
    from_address: 'noreply@spock-quant.com'
    subject_prefix: '[FX Alert]'

# 스팸 방지 설정
spam_prevention:
  enabled: true
  time_window_minutes: 60     # 1시간 단위 제한
  max_critical_per_window: 5  # 1시간당 최대 5개 CRITICAL 알림
  max_warning_per_window: 10  # 1시간당 최대 10개 WARNING 알림
  duplicate_detection: true   # 중복 신호 필터링
  cooldown_minutes: 10        # 동일 신호 재알림 대기 시간

# Quiet Hours 설정
quiet_hours:
  enabled: true
  start: '01:00'    # 01:00 KST
  end: '07:00'      # 07:00 KST
  bypass_critical: true  # CRITICAL 알림은 quiet hours에도 전송

# 통화별 알림 우선순위
currency_priority:
  high:      # 높은 우선순위 (모든 알림)
    - 'USD'
    - 'EUR'
    - 'JPY'
  medium:    # 중간 우선순위 (WARNING 이상만)
    - 'CNY'
    - 'GBP'
    - 'CHF'
  low:       # 낮은 우선순위 (CRITICAL만)
    - 'AUD'
    - 'CAD'
    - 'HKD'
    - 'SGD'

# 알림 메시지 템플릿
message_templates:
  # Slack 메시지
  slack:
    critical: |
      🚨 *CRITICAL FX Alert*

      *Currency*: {currency}
      *Signal*: {signal_type}
      *Magnitude*: {magnitude:.2%}
      *Current Rate*: {current_rate:,.4f}
      *Previous Rate*: {previous_rate:,.4f}
      *Date*: {date}

      📊 *Change*: {change:+.2%}

    warning: |
      ⚠️ *FX Warning*

      *Currency*: {currency} | *Signal*: {signal_type}
      *Magnitude*: {magnitude:.2%} | *Date*: {date}

    summary: |
      📊 *FX Daily Summary* ({date})

      *Total Signals*: {total_signals}
      *Critical*: {critical_count} | *Warning*: {warning_count} | *Info*: {info_count}

      {signal_list}

  # 이메일 메시지
  email:
    subject_critical: '[CRITICAL] FX Alert: {currency} {signal_type}'
    subject_warning: '[WARNING] FX Alert: {currency}'
    subject_summary: '[SUMMARY] FX Daily Report - {date}'

    body_html: |
      <html>
      <body>
        <h2>{severity} FX Alert</h2>
        <table border="1" cellpadding="5">
          <tr><th>Currency</th><td>{currency}</td></tr>
          <tr><th>Signal Type</th><td>{signal_type}</td></tr>
          <tr><th>Magnitude</th><td>{magnitude:.2%}</td></tr>
          <tr><th>Current Rate</th><td>{current_rate:,.4f}</td></tr>
          <tr><th>Previous Rate</th><td>{previous_rate:,.4f}</td></tr>
          <tr><th>Date</th><td>{date}</td></tr>
        </table>
      </body>
      </html>
